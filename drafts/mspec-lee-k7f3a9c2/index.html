<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<meta name="googlebot" content="noindex, nofollow" />
<title>MSpec Drafts</title>
<link rel="icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0A0E14;
    --carbon: #14181F;
    --slate2: #1A2030;
    --steel: #2A3142;
    --bone: #F0F0EC;
    --silver: #C8CCD0;
    --muted: #6B7280;
    --mblue: #0066B1;
    --mviolet: #6E5DA5;
    --mred: #E22718;
    --ok: #4ade80;
    --hold: #facc15;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--ink);
    color: var(--bone);
    font-family: Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .stripe {
    height: 3px;
    background: linear-gradient(90deg, var(--mblue) 0%, var(--mviolet) 50%, var(--mred) 100%);
  }
  .display {
    font-family: Anton, Impact, "Arial Narrow", sans-serif;
    font-weight: 400;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    line-height: 0.95;
  }
  .mono {
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }

  /* gate */
  #gate {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
    background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .gate-main {
    display: grid;
    place-items: center;
    padding: 24px 20px 48px;
  }
  .gate-card {
    width: min(100%, 420px);
    background: var(--carbon);
    border: 1px solid var(--steel);
    padding: 28px 22px 22px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .brand img { width: 44px; height: 44px; border-radius: 4px; }
  .brand-name { font-size: 28px; }
  .kicker {
    margin: 0 0 18px;
    color: var(--mblue);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  label {
    display: block;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  input[type="password"] {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--steel);
    padding: 14px 12px;
    font-size: 16px;
    outline: none;
  }
  input[type="password"]:focus { border-color: var(--mblue); }
  .unlock {
    width: 100%;
    margin-top: 14px;
    border: 0;
    padding: 14px 16px;
    background: linear-gradient(90deg, var(--mblue) 0%, var(--mviolet) 50%, var(--mred) 100%);
    color: white;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .unlock:active { opacity: 0.85; }
  .gate-error {
    margin: 12px 0 0;
    color: var(--mred);
    font-size: 12px;
  }

  /* app */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(10, 14, 20, 0.94);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--steel);
    padding-top: env(safe-area-inset-top);
  }
  .topbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
  }
  .topbar .brand { margin: 0; }
  .topbar .brand img { width: 32px; height: 32px; }
  .topbar .brand-name { font-size: 22px; }
  .lock {
    border: 1px solid var(--steel);
    background: transparent;
    color: var(--silver);
    padding: 10px 12px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .wrap {
    width: min(720px, 100%);
    margin: 0 auto;
    padding: 16px 16px calc(28px + env(safe-area-inset-bottom));
  }
  .intro {
    margin: 8px 0 14px;
    color: var(--silver);
    font-size: 14px;
    line-height: 1.45;
  }
  .stats {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .chip, .filter {
    border: 1px solid var(--steel);
    background: var(--slate2);
    color: var(--silver);
    padding: 8px 10px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .filter.on {
    border-color: var(--mblue);
    color: var(--bone);
  }
  .day {
    margin: 22px 0 10px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .card {
    background: var(--slate2);
    border: 1px solid var(--steel);
    margin-bottom: 16px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
    padding: 10px 12px;
    border-bottom: 1px solid var(--steel);
  }
  .sched { color: var(--silver); font-size: 11px; letter-spacing: 0.06em; }
  .status {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 4px 8px;
    border: 1px solid var(--steel);
    color: var(--muted);
  }
  .status.scheduled { color: var(--mblue); border-color: var(--mblue); }
  .status.draft { color: var(--silver); }
  .status.hold { color: var(--hold); border-color: var(--hold); }
  .frame {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    padding: 0;
    border: 0;
    border-bottom: 1px solid var(--steel);
    background: var(--ink);
  }
  .hero-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: var(--ink);
  }
  .counter {
    position: absolute;
    right: 8px;
    bottom: 8px;
    background: rgba(10, 14, 20, 0.8);
    padding: 4px 8px;
    font-size: 11px;
    letter-spacing: 0.06em;
  }
  .thumbs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 8px;
    border-bottom: 1px solid var(--steel);
    -webkit-overflow-scrolling: touch;
  }
  .thumb {
    flex: 0 0 auto;
    width: 64px;
    height: 64px;
    padding: 0;
    border: 1px solid var(--steel);
    background: var(--ink);
  }
  .thumb.on { border-color: var(--mblue); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph {
    aspect-ratio: 4 / 3;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 10px;
    padding: 20px;
    text-align: center;
    background: var(--ink);
    border-bottom: 1px solid var(--steel);
  }
  .ph-kicker {
    color: var(--muted);
    font-size: 22px;
  }
  .ph-note {
    margin: 0;
    max-width: 36ch;
    color: var(--silver);
    font-size: 13px;
    line-height: 1.45;
  }
  .body { padding: 14px 14px 16px; }
  h2 {
    margin: 0 0 8px;
    font-size: 32px;
  }
  .fit { color: var(--mblue); font-size: 12px; letter-spacing: 0.04em; margin-bottom: 4px; }
  .size { color: var(--silver); font-size: 12px; margin-bottom: 8px; }
  .price-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 12px;
    margin: 8px 0;
  }
  .asking { font-size: 28px; }
  .loc { color: var(--muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
  .grades {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--steel);
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .hosted {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  .buffer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--steel);
  }
  .buffer-id {
    min-width: 0;
    color: var(--silver);
    font-size: 11px;
    word-break: break-all;
  }
  .buffer-id span {
    display: block;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 0.12em;
    margin-bottom: 4px;
  }
  .copy {
    flex: 0 0 auto;
    border: 1px solid var(--steel);
    background: var(--ink);
    padding: 10px 12px;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .caption, .notes {
    margin: 12px 0 0;
    color: var(--silver);
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .notes { color: var(--muted); font-size: 13px; }
  .forum {
    display: inline-block;
    margin-top: 12px;
    color: var(--bone);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    border-bottom: 1px solid var(--mblue);
    padding-bottom: 2px;
  }
  .load-error {
    border: 1px solid var(--mred);
    color: var(--bone);
    padding: 14px;
    margin: 12px 0;
  }
  .foot {
    margin-top: 8px;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.5;
  }

  /* lightbox */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 40;
    background: rgba(10, 14, 20, 0.96);
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .lb-bar, .lb-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
  }
  .lb-title { font-size: 12px; letter-spacing: 0.08em; color: var(--silver); }
  .lb-btn {
    border: 1px solid var(--steel);
    background: var(--carbon);
    min-width: 44px;
    min-height: 44px;
    padding: 0 12px;
  }
  .lb-stage {
    display: grid;
    place-items: center;
    min-height: 0;
    padding: 0 8px;
  }
  #lb-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>
  <div id="gate">
    <div class="stripe"></div>
    <main class="gate-main">
      <form id="gate-form" class="gate-card">
        <div class="brand">
          <img src="/assets/logo.png" alt="" width="44" height="44" />
          <div class="display brand-name">MSpec Wheels</div>
        </div>
        <p class="kicker mono">Private drafts</p>
        <label class="mono" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required />
        <button class="unlock mono" type="submit">Unlock</button>
        <p id="gate-error" class="gate-error mono" hidden>Wrong password.</p>
      </form>
    </main>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <div class="stripe"></div>
      <div class="topbar-row">
        <div class="brand">
          <img src="/assets/logo.png" alt="" width="32" height="32" />
          <div class="display brand-name">Drafts</div>
        </div>
        <button id="lock" class="lock mono" type="button">Lock</button>
      </div>
    </header>
    <div class="wrap">
      <p id="intro" class="intro">Buffer review. Photos are hosted on this site.</p>
      <div id="stats" class="stats"></div>
      <div id="list"></div>
      <p class="foot mono">Blank fit, price, and caption fields are not filled in yet. Forgestar is not listed.</p>
    </div>
  </div>

  <div id="lightbox" hidden>
    <div class="lb-bar">
      <div id="lb-title" class="lb-title mono"></div>
      <button id="lb-close" class="lb-btn mono" type="button">Close</button>
    </div>
    <div class="lb-stage">
      <img id="lb-img" alt="" />
    </div>
    <div class="lb-nav">
      <button id="lb-prev" class="lb-btn mono" type="button">Prev</button>
      <div id="lb-count" class="lb-title mono"></div>
      <button id="lb-next" class="lb-btn mono" type="button">Next</button>
    </div>
  </div>

  <noscript>
    <p class="mono" style="padding:24px;color:#C8CCD0">JavaScript is required to unlock drafts.</p>
  </noscript>
  <script src="app.js"></script>
</body>
</html>
